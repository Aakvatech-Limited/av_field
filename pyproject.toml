[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "av_field"
authors = [{name = "Aakvatech Limited", email = "info@aakvatech.com"}]
description = "Offline field visits and order capture for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
